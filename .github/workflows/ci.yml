name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gitwatch-v2

jobs:
  # ── Run on every push and PR ─────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

  # ── Only on push to main ──────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to DigitalOcean droplet ────────────────────────────────────────────
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/gitwatch

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/gitwatch

            # Write .env from GitHub secrets
            cat > .env << EOF
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            GITHUB_CLIENT_ID=${{ secrets.AUTH_GITHUB_CLIENT_ID }}
            GITHUB_CLIENT_SECRET=${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
            GITHUB_WEBHOOK_SECRET=${{ secrets.AUTH_GITHUB_WEBHOOK_SECRET }}
            APP_URL=${{ secrets.APP_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            ADMIN_TELEGRAM_ID=${{ secrets.ADMIN_TELEGRAM_ID }}
            CRON_INTERVAL_SECS=30
            PORT=5000
            RUST_LOG=info
            EOF

            # Pull the exact image built in this run
            docker pull ${{ env.IMAGE }}:${{ needs.build-and-push.outputs.sha_tag }}
            docker tag ${{ env.IMAGE }}:${{ needs.build-and-push.outputs.sha_tag }} ${{ env.IMAGE }}:latest

            # Pull new image and recreate only the app container
            docker compose -f docker-compose.prod.yml up -d --force-recreate app

            # Wait for health check
            echo "Waiting for app to become healthy..."
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose -f docker-compose.prod.yml ps -q app) 2>/dev/null || echo "starting")
              echo "  attempt $i: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "App is healthy"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "App failed health check — rolling back"
                docker compose -f docker-compose.prod.yml logs --tail=50 app
                exit 1
              fi
              sleep 5
            done

            # Remove only dangling (untagged) image layers — never touches other projects' images
            docker image prune -f
