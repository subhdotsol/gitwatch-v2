services:
  app:
    image: ${DOCKERHUB_USERNAME}/gitwatch-v2:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
